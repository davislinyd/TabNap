<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabNap</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;color:#333;background:#f5f5f5;min-width:400px;max-width:400px;max-height:600px}
    .container{display:flex;flex-direction:column;min-height:200px;max-height:600px}
    .header{padding:16px;background:#fff;border-bottom:1px solid #e0e0e0;flex-shrink:0}
    .title-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
    .title{font-size:18px;font-weight:600;color:#1a1a1a;margin:0}
    .version{font-size:11px;color:#999;font-weight:500;flex-shrink:0}
    .subtitle{font-size:12px;color:#666}
    .loading-state{padding:24px;text-align:center;color:#888;font-size:13px}
    .tab-list{flex:1;overflow-y:auto;padding:8px;max-height:450px}
    .hidden{display:none!important}
  </style>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-row">
        <h1 class="title">TabNap</h1>
        <span id="extension-version" class="version" aria-label="版本"></span>
      </div>
      <p class="subtitle">選擇分頁並釋放記憶體</p>
      <p id="fallback-notice" class="fallback-notice hidden">此瀏覽器不支援終止 process，已改用 Discard 休眠分頁。</p>
      <div class="auto-end-settings">
        <div class="auto-end-top-row">
          <label class="auto-end-toggle">
            <input type="checkbox" id="auto-end-enabled" />
            <span>啟用自動釋放</span>
          </label>
          <div id="batch-actions" class="batch-actions hidden">
            <button id="end-task-all" class="end-task-all-btn">全部釋放</button>
            <button id="restore-all" class="restore-all-btn">全部喚醒</button>
          </div>
        </div>
        <div class="auto-end-input-row">
          <label for="auto-end-minutes">預設閒置</label>
          <input type="number" id="auto-end-minutes" min="1" max="120" value="15" />
          <span class="auto-end-unit">分鐘</span>
        </div>
      </div>
      <div class="rules-section">
        <div class="rules-header">
          <span class="rules-title">自動釋放規則</span>
          <button type="button" id="rules-toggle" class="rules-toggle" aria-expanded="false">展開</button>
        </div>
        <div id="rules-content" class="rules-content hidden">
          <p class="rules-hint">Never Close（分頁或站點規則）會略過自動釋放與全部釋放；單一分頁仍可強制釋放。其餘分頁可選自訂閒置分鐘。</p>
          <div class="rule-form-row">
            <select id="rule-match-type" class="rule-select">
              <option value="domain">Domain</option>
              <option value="fqdn">FQDN</option>
              <option value="url">URL</option>
            </select>
            <input id="rule-pattern" class="rule-input" type="text" placeholder="example.com / mail.example.com / https://example.com/page" />
          </div>
          <div class="rule-form-row">
            <select id="rule-mode" class="rule-select">
              <option value="never">Never Close</option>
              <option value="idle">Auto End After</option>
            </select>
            <div id="rule-idle-group" class="rule-idle-group hidden">
              <input type="number" id="rule-idle-minutes" min="1" max="120" value="15" />
              <span class="rule-idle-unit">分鐘</span>
            </div>
            <button type="button" id="rule-add" class="rule-add-btn">儲存規則</button>
          </div>
          <ul id="rule-list" class="rule-list"></ul>
        </div>
      </div>
    </header>

    <div id="error-message" class="error-message hidden">載入分頁失敗。</div>

    <div id="empty-state" class="empty-state hidden">
      目前沒有可操作的分頁。
    </div>

    <div id="tab-list" class="tab-list"></div>

    <div class="log-section">
      <div class="log-header">
        <span class="log-title">
          除錯 Log
          <span id="log-count" class="log-count" aria-live="polite">0</span>
        </span>
        <button type="button" id="log-toggle" class="rules-toggle" aria-expanded="false" aria-controls="log-panel">展開</button>
      </div>
      <div id="log-panel" class="log-panel hidden">
        <div class="log-toolbar">
          <button type="button" id="copy-debug-log" class="settings-btn" title="複製除錯 log 到剪貼簿">複製</button>
          <button type="button" id="clear-debug-log" class="settings-btn" title="清除 log">清除</button>
        </div>
        <pre id="log-viewer" class="log-viewer" aria-label="除錯 log 內容"></pre>
      </div>
    </div>

    <footer class="footer">
      <span id="shortcut-display" class="shortcut-hint">快捷鍵：載入中...</span>
      <div class="footer-actions">
        <button type="button" id="open-shortcut-settings" class="settings-btn">設定快捷鍵</button>
      </div>
    </footer>
  </div>
  <script src="debug-log.js"></script>
  <script src="auto-end-rules.js"></script>
  <script src="prefix-tab-title.js"></script>
  <script src="end-task-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
